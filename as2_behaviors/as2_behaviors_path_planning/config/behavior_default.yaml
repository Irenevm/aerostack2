/**:
  ros__parameters:
    node_frequency: 200.0   # Node's internal update rate [Hz]
    run_frequency: 100.0    # Behavior's on_run() call rate [Hz] — the reactive logic
                             # (corridor, MAP_CHECK, frontier retry) only runs here
    enable_visualization: false  # Enable visualization topics
    enable_path_optimizer: false  # Enable path smoother
    safety_distance: 0.5  # Distance to obstacle [m]
    drone_mask_factor: 1  # Factor to increase the masked area around the drone
    simplify_path: false # Enable path simplification using rdp
    dist_to_line_threshold: 0.0 # Max distance for a point to be considered contained by a straight line
    same_goal_tolerance: 0.05 # XY tolerance [m] to consider two goals equivalent
    max_replans: 15  # Maximum number of reactive replans before aborting navigation
    map_check_period: 0.5  # Seconds between checks for a direct path to the goal [s]

    # Frontier-arrival settle retry: waits and retries instead of aborting
    # immediately when a just-reached frontier looks like a dead end (the
    # map can lag briefly behind what the sensor already saw).
    frontier_stuck_settle_s: 1.8       # [s] wait between retries
    frontier_stuck_max_retries: 6      # max retries before giving up

    # Physics-based reactive braking corridor: reads a LaserScan directly
    # (independent of MAP_CHECK) and brakes when danger_distance(v) =
    # v*(corridor_k_brake_s + corridor_l_detect_s) + corridor_margin_m is
    # closer than what's ahead. See doc/Agosto/ for full design rationale.
    corridor_scan_topic: "sensor_measurements/lidar/scan"  # LaserScan topic to read — any
                                        # sensor whose data is converted to LaserScan works
                                        # here (e.g. a depth camera via pointcloud_to_laserscan),
                                        # with no code changes
    corridor_check_period: 0.05      # Timer period for corridor evaluation [s]
    corridor_half_angle_deg: 25.0    # Half-angle of the frontal detection corridor [deg]
    corridor_half_width: 0.6         # Lateral half-width of the corridor [m]
    corridor_k_brake_s: 1.0          # [s] measured stopping-distance/speed ratio
    corridor_l_detect_s: 0.25        # [s] this layer's own detection latency
    corridor_margin_m: 0.4           # [m] fixed extra safety margin
    corridor_stop_distance: 0.4      # [m] speed floor kicks in below this — kept below
                                      # safety_distance so it doesn't fight a safe A* detour
    corridor_floor_speed: 0.4        # [m/s] never fully stops
    corridor_min_cluster: 3          # Min contiguous rays to count as a detection
    corridor_persistence: 1          # Consecutive confirmations before reacting
    corridor_speed_epsilon: 0.1      # Min speed delta before resending modify() [m/s]
    corridor_post_replan_grace_s: 2.5  # Suspend corridor for this long after any replan,
                                        # unless something has gotten closer since (trust
                                        # the detour A* just computed otherwise)
    corridor_min_brake_hold_s: 1.0     # Min time before release is even considered (anti-chatter)
    corridor_min_modify_interval_s: 0.4  # Min gap between corridor modify() calls
